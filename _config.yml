title: Satranç Kahvesi
description: Kahve eşliğinde satranç sohbetleri
lang: tr
baseurl: ""
url: "https://satranckahvesi.com"
google_analytics: G-EQR45VG5M7

markdown: kramdown
permalink: /posts/:title/
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"

# Link preview image (WhatsApp, social cards) for pages that do not set their own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.png

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - docs/
  - tests/
  - README.md
  - scripts/
  - vendor/
  - node_modules/

# Leading chess titles that are not part of a person's name (author initials).
chess_titles: [FM, GM, IM, CM, WFM, WGM, WIM, WCM, NM, AGM, AIM]
