title: Satranç Kahvesi
description: Kahve eşliğinde satranç sohbetleri; açılış teorisinden oyun sonlarına, turnuva günlüklerinden kitap incelemelerine köşe yazıları.
lang: tr
baseurl: ""
url: "https://satranckahvesi.com"

markdown: kramdown
permalink: /posts/:title/
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]
  typographic_symbols:
    hellip: "..."
    mdash: "---"
    ndash: "--"

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - eslint.config.js
  - docs/
  - tests/
  - README.md
  - scripts/
  - vendor/
  - node_modules/

# Leading chess titles that are not part of a person's name (author initials).
chess_titles: [FM, GM, IM, CM, WFM, WGM, WIM, WCM, NM, AGM, AIM]
