<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Satranç Kahvesi">
  <title>Satranç Kahvesi</title>

  <!-- saucer edge -->
  <circle cx="240" cy="240" r="228" fill="none" stroke="#2f1c10" stroke-width="1.5" opacity="0.2"/>

  <!-- cup rim (ceramic band) -->
  <circle cx="240" cy="240" r="200" fill="#ece0c8" stroke="#2f1c10" stroke-width="2"/>

  <!-- coffee surface -->
  <circle cx="240" cy="240" r="182" fill="#43261a" stroke="#2f1c10" stroke-width="1.5" opacity="1"/>
  <circle cx="240" cy="240" r="176" fill="none" stroke="#a9772c" stroke-width="1.25" opacity="0.5"/>

  <!-- sheen -->
  <path d="M120,150 A182,182 0 0,1 190,86" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.08"/>

  <!-- latte art: chess king in foam -->
  <g transform="translate(240,150) scale(2.0)" fill="#ece0c8">
    <!-- cross -->
    <rect x="-3" y="-6" width="6" height="16"/>
    <rect x="-9" y="-1" width="18" height="6"/>
    <!-- finial -->
    <circle cx="0" cy="20" r="8"/>
    <!-- crown band -->
    <rect x="-22" y="30" width="44" height="10"/>
    <polygon points="-18,30 -10,30 -14,20"/>
    <polygon points="-4,30 4,30 0,20"/>
    <polygon points="10,30 18,30 14,20"/>
    <!-- tapered body -->
    <polygon points="-16,42 16,42 30,80 -30,80"/>
    <!-- base -->
    <polygon points="-30,80 30,80 40,96 -40,96"/>
    <!-- etched detail lines -->
    <rect x="-24" y="58" width="48" height="2.5" fill="#43261a" opacity="0.35"/>
    <rect x="-28" y="70" width="56" height="2.5" fill="#43261a" opacity="0.35"/>
  </g>
</svg>
