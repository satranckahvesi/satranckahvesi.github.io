<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-label="Satranç Kahvesi">
  <title>Satranç Kahvesi</title>

  <!-- emblem: concentric rings -->
  <circle cx="240" cy="190" r="146" fill="none" stroke="#2f1c10" stroke-width="2.5"/>
  <circle cx="240" cy="190" r="132" fill="none" stroke="#a9772c" stroke-width="1.25"/>

  <!-- monogram mark -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2f1c10">
    <text x="234" y="246" font-size="152" text-anchor="end">S</text>
    <text x="246" y="246" font-size="152" text-anchor="start">K</text>
  </g>
  <line x1="205" y1="264" x2="275" y2="264" stroke="#a9772c" stroke-width="1.25"/>

  <!-- divider -->
  <g stroke="#a9772c" stroke-width="1.25">
    <line x1="150" y1="392" x2="204" y2="392"/>
    <line x1="276" y1="392" x2="330" y2="392"/>
  </g>
  <path d="M240,386 L246,392 L240,398 L234,392 Z" fill="#a9772c"/>

  <!-- wordmark -->
  <text x="240" y="432" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="7"
        fill="#2f1c10">SATRANÇ KAHVESİ</text>
  <text x="240" y="460" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="5.5"
        fill="#a9772c">KAHVE &amp; SATRANÇ KÜLTÜRÜ</text>
</svg>
