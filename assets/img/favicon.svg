<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 45 480 400" role="img" aria-label="Satranç Kahvesi">
  <defs>
    <radialGradient id="cupGrad" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#4d7196"/>
      <stop offset="55%" stop-color="#26425e"/>
      <stop offset="100%" stop-color="#152230"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="10%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#3c6084"/>
      <stop offset="100%" stop-color="#12202e"/>
    </linearGradient>
    <radialGradient id="coffeeGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ad7a4d"/>
      <stop offset="100%" stop-color="#7c4f29"/>
    </radialGradient>
  </defs>

  <!-- cup body (front wall) -->
  <path d="M75,200 A195,150 0 0,0 465,200 L420,430 A150,34 0 0,1 120,430 Z" fill="url(#bodyGrad)"/>

  <!-- handle -->
  <path d="M462,192 C524,192 524,272 462,272" fill="none" stroke="url(#bodyGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- rim (navy ceramic band) -->
  <ellipse cx="270" cy="200" rx="195" ry="150" fill="url(#cupGrad)"/>

  <!-- coffee surface -->
  <ellipse cx="270" cy="200" rx="168" ry="128" fill="url(#coffeeGrad)"/>
  <ellipse cx="270" cy="200" rx="168" ry="128" fill="none" stroke="#e7dcc4" stroke-width="3" opacity="0.4"/>

  <!-- rim gloss highlight -->
  <path d="M118,138 A195,150 0 0,1 226,58" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.18"/>

  <!-- latte art: crown -->
  <g transform="translate(270,196)" fill="#f2e6cf" stroke="#5c3a1e" stroke-width="4" stroke-linejoin="round">
    <rect x="-48" y="30" width="96" height="16"/>
    <polygon points="-42,30 -15,30 -29,-8"/>
    <polygon points="-11,30 11,30 0,-27"/>
    <polygon points="15,30 42,30 29,-8"/>
    <circle cx="-29" cy="-8" r="7"/>
    <circle cx="29" cy="-8" r="7"/>
    <circle cx="0" cy="-31" r="8"/>
  </g>
  <g transform="translate(270,196)" fill="#5c3a1e">
    <rect x="-4" y="-54" width="8" height="18"/>
    <rect x="-12.5" y="-49" width="25" height="7"/>
  </g>
</svg>
