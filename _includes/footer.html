<footer class="site-footer">
    <nav class="footer-nav" aria-label="Alt gezinme">
        {% include nav-links.html with_home=true %}
    </nav>
    <p class="footer-credit">{{ site.title }} &copy; {{ site.time | date: '%Y' }} &middot; <a href="{{ '/gizlilik/' | relative_url }}">Gizlilik ve çerezler</a><span class="install-app-wrap" hidden> &middot; <button type="button" class="install-app">Uygulamayı yükle</button></span>{% if site.push.endpoint.size > 0 and site.push.public_key.size > 0 %}<span class="push-wrap" hidden> &middot; <button type="button" class="push-toggle" data-endpoint="{{ site.push.endpoint }}" data-key="{{ site.push.public_key }}">Bildirimleri aç</button></span>{% endif %}{% if jekyll.environment == "production" and site.google_analytics %} &middot; <button type="button" class="cookie-settings">Çerez tercihleri</button>{% endif %}</p>
    <p class="push-status" role="status" aria-live="polite"></p>
</footer>
