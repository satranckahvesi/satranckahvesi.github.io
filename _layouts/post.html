---
layout: default
---
{% assign author_slug = page.author | slugify: "latin" %}
{% assign column_slug = page.column | slugify: "latin" %}
<article class="post">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
        <a href="{{ '/yazarlar/' | append: author_slug | append: '/' | relative_url }}">{{ page.author }}</a>
        ·
        <a href="{{ '/koseler/' | append: column_slug | append: '/' | relative_url }}">{{ page.column }}</a>
        · {% include turkish-date.html date=page.date %}
    </p>
    <div class="post-body">
        {{ content }}
    </div>
</article>
<a class="back-link" href="{{ '/' | relative_url }}">← Ana sayfaya dön</a>
