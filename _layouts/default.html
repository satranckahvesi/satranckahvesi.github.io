<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Logo, wordmark and gap scale fluidly with the masthead's own box
           (site.css makes .site-header a cqw query container, now with no
           side padding of its own) rather than the raw browser viewport,
           so the reference point for "fully grown" is how wide that box
           actually is, not the window.

           A plain cqw percentage keeps a fixed ratio to the container at
           any size — confirmed directly, e.g. the original 17.5/6.6/2.9
           coefficients held the row at a constant ~68% of the container
           from 320px up to 3840px, never more, never less. That's exactly
           what makes a single coefficient set usable for "no whitespace
           at any width, mobile or desktop alike" instead of needing a
           breakpoint: solve for the coefficients once so the ratio comes
           out near 100%, and it reads as edge-to-edge everywhere, with no
           separate mobile-vs-desktop case to keep in sync. The ~2%
           left over (98%, not 100%) is deliberate headroom against the
           row actually wrapping to two lines or overflowing the
           container — font rendering isn't perfectly linear at every
           size (hinting/rounding), so aiming for exactly 100% would risk
           tipping over it right when the measurement doesn't quite line
           up. Confirmed directly at containers from 320px to 3840px. */
        .brand {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 4.18cqw;
        }
        .site-logo {
            width: 25.22cqw;
            height: 25.22cqw;
            flex: none;
        }
        .logo {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 9.51cqw;
            font-weight: 400;
            color: #16283a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            <h1 class="logo">{{ site.title }}</h1>
        </a>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
