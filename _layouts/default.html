<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 2.5rem 1rem; text-align: center; }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 1.1rem;
        }
        .site-logo { width: 128px; height: 128px; flex: none; }
        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.4rem;
            font-weight: 600;
            color: #16283a;
        }
    </style>
</head>
<body>
    <div class="brand">
        <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ page.title }}">
        <span class="logo">{{ page.title }}</span>
    </div>
    {{ content }}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js"></script>
</body>
</html>
