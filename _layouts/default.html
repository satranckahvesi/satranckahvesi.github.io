<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Logo, wordmark and gap scale fluidly with the masthead's own box
           (site.css makes .site-header a cqw query container) rather than
           the raw browser viewport, so the reference point for "fully
           grown" is how wide that box actually is, not the window — the
           two only used to coincide by accident, back when .site-header
           was capped at the page's own narrow content width. Only a floor
           remains below (max(), not clamp()), tuned so the wordmark still
           fits next to the logo image on one line down to a 320px-wide
           container. Deliberately kept fluid rather than switched to the
           standard-heading-scale 2em other h1/h2/h3 elements use now:
           this one still has to fit next to the logo image on one line
           down to a 320px container, which a flat size can't guarantee
           the way this clamp does. */
        .brand {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: max(0.75rem, 0.2rem + 2.9cqw);
        }
        .site-logo {
            width: max(56px, 17.5cqw);
            height: max(56px, 17.5cqw);
            flex: none;
        }
        .logo {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: max(1.35rem, 0.1rem + 6.6cqw);
            font-weight: 400;
            color: #16283a;
        }

        /* At 17.5/6.6/2.9cqw the whole brand row only ever fills about
           two-thirds of the container — confirmed directly, that ratio
           holds essentially flat from a 640px container up to a 3840px
           one, since a plain cqw percentage scales the row and the
           container by the same factor forever; no single coefficient
           fixes that at every size without either overflowing on a very
           wide monitor or under-filling on a merely wide one. Past 640px
           (this design's own existing desktop reference point) this
           switches to steeper per-cqw rates instead — chosen, together
           with the fixed px term alongside each, to exactly continue
           from each property's own value at 640px (no jump at the
           switch) while approaching (never reaching, however wide the
           container gets) a ~98%-of-container asymptote for the row as
           a whole, so it can never actually overflow no matter how wide
           a screen it's on. Confirmed directly at containers from 640px
           to 5120px: smooth growth throughout, reading as edge-to-edge
           by ~1920px (87.6%) and still climbing (93-94%) out past 4K. */
        @container (min-width: 640px) {
            .brand {
                gap: calc(4.18cqw - 4.8px);
            }
            .site-logo {
                width: calc(25.22cqw - 49.4px);
                height: calc(25.22cqw - 49.4px);
            }
            .logo {
                font-size: calc(9.51cqw - 16.9px);
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            <h1 class="logo">{{ site.title }}</h1>
        </a>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
