<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Three stacked rows — logo, "Satranç", "Kahvesi" — each centered
           and each sized off the masthead's own box (site.css makes
           .site-header a cqw query container) rather than the raw
           viewport. A flat 1rem gap separates all three, deliberately
           NOT part of the fluid cqw sizing below: it keeps the rows
           close together as one lockup at every size instead of the gap
           itself growing on a wide screen.

           The two wordmark lines share one font-size, sized off
           "Satranç" specifically (the wider of the two words) so IT
           reads as close to edge-to-edge as the single-line wordmark
           used to — "Kahvesi", a touch narrower at that same size,
           just centers under it. A plain cqw percentage keeps a fixed
           ratio to the container at any size (confirmed in the previous
           single-line layout: unchanging from a 320px container up to
           a 3840px one), so one coefficient, solved once, holds that
           fill for "Satranç" at every width — no separate mobile/desktop
           case needed. Logo width is its own independent cqw coefficient
           now that it's no longer sharing a row with the wordmark. */
        .brand {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .site-logo {
            width: 55cqw;
            height: 55cqw;
            flex: none;
        }
        .logo {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 28.6cqw;
            line-height: 1.15;
            /* Google Fonts is asked for italic 400 explicitly (see the
               <link> above) — without it in that request, the browser
               has no 400 italic file to use and falls back to the
               nearest weight it did fetch (600), silently overriding
               this. */
            font-weight: 400;
            color: #16283a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            {% assign title_words = site.title | split: " " %}
            <h1 class="logo">{% for word in title_words %}<span class="logo-line">{{ word }}</span>{% endfor %}</h1>
        </a>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
