<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Logo, wordmark and gap scale fluidly with viewport width instead
           of jumping at a single breakpoint, so the masthead actually
           widens to fill typical phone screens (previously pinned at its
           narrow 320px-safe minimum on every mobile width) while still
           fitting one line down to a 320px viewport and matching the
           existing desktop size once it reaches 640px. Each clamp's
           preferred value is a straight line through those same two
           reference points (320px -> mobile minimum, 640px -> desktop
           size), so nothing changes at either end — only the sizes
           between them are now filled in continuously. */
        .brand {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: clamp(0.75rem, 0.2rem + 2.9vw, 1.3rem);
        }
        .site-logo {
            width: clamp(56px, 17.5vw, 112px);
            height: clamp(56px, 17.5vw, 112px);
            flex: none;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.35rem, 0.1rem + 6.6vw, 2.6rem);
            font-weight: 400;
            color: #16283a;
        }

        /* Homepage only, mobile: logo/wordmark/gap scale steeply enough
           that the masthead fills the viewport down to just the 1rem
           each side .site-header's own full-bleed padding already
           leaves — visibly wider than the site-wide clamp above, which
           deliberately stays conservative since it also has to fit
           under a post title or column heading on every other page.
           Each clamp's preferred value is a straight line fit (not a
           hand-derived ratio — solved by measuring the exact size that
           fills width-2rem without wrapping to two lines at several
           widths, then fitting vw/px coefficients through those points)
           through 320px and 430px; the shared 112px/2.6rem/1.3rem max
           still caps it at the existing desktop size once the line
           would otherwise grow past that. */
        .is-home .site-logo {
            width: clamp(56px, 25.5vw - 8.5px, 112px);
            height: clamp(56px, 25.5vw - 8.5px, 112px);
        }
        .is-home .logo {
            font-size: clamp(1.35rem, 10.4vw - 0.21rem, 2.6rem);
        }
        .is-home .brand {
            gap: clamp(0.75rem, 5.8vw - 0.12rem, 1.3rem);
        }
    </style>
</head>
<body{% if page.url == "/" %} class="is-home"{% endif %}>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            <span class="logo">{{ site.title }}</span>
        </a>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
