<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Logo, wordmark and gap scale fluidly with the masthead's own box
           (site.css makes .site-header a cqw query container) rather than
           the raw browser viewport, so the reference point for "fully
           grown" is how wide that box actually is, not the window — the
           two only used to coincide by accident, back when .site-header
           was capped at the page's own narrow content width. Each clamp's
           preferred value is a straight line through two reference points
           (320px container -> mobile minimum, ~900px container -> desktop
           size) via cqw, so it keeps widening on a big full-bleed
           masthead past where the old vw version plateaued at 640px,
           while still fitting one line down to a 320px-wide container.
           Deliberately kept fluid rather than switched to the
           standard-heading-scale 2em other h1/h2/h3 elements use now:
           this one still has to fit next to the logo image on one line
           down to a 320px container, which a flat size can't guarantee
           the way this clamp does. */
        .brand {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: clamp(0.75rem, 0.2rem + 2.9cqw, 1.75rem);
        }
        .site-logo {
            width: clamp(56px, 17.5cqw, 160px);
            height: clamp(56px, 17.5cqw, 160px);
            flex: none;
        }
        .logo {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1.35rem, 0.1rem + 6.6cqw, 3.6rem);
            font-weight: 400;
            color: #16283a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            <h1 class="logo">{{ site.title }}</h1>
        </a>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
