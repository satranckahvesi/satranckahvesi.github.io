<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>
        /* Modeled on the Athena Jekyll theme's own masthead
           (_layouts/home.html + _sass/_utilities.scss in
           github.com/broccolini/athena): a left-aligned, bold, upright
           (not italic) title contained in a reading-width column, sized
           on a simple two-point fluid scale rather than stretched to
           fill the bar — Athena leaves generous whitespace around it
           instead of chasing edge-to-edge, and just lets the title wrap
           to a second line naturally on a narrow container instead of
           forcing a fixed line split. A short accent rule under the
           title echoes Athena's own .border-top-thick.

           Kept from this site's own version rather than copied
           verbatim: the logo image (Athena's theme doesn't have one)
           and the full-bleed white bar it sits on (site.css's
           .site-header), since that's this site's own established
           chrome, not part of what was asked to resemble. */
        .brand {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        .site-logo {
            width: clamp(40px, 7vw, 72px);
            height: clamp(40px, 7vw, 72px);
            flex: none;
        }
        .logo {
            margin: 0;
            text-align: left;
            font-family: 'Playfair Display', serif;
            font-style: normal;
            font-weight: 700;
            font-size: clamp(2rem, 1rem + 5vw, 4rem);
            line-height: 1.1;
            color: #16283a;
        }
        /* Same box model as .brand (max-width/margin/padding) so the
           short line inside lands under the title's own left edge
           rather than centering itself as an unrelated 3rem block in
           the full-bleed bar. */
        .masthead-rule-wrap {
            max-width: 700px;
            margin: 1rem auto 0;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        .masthead-rule {
            display: block;
            width: 3rem;
            height: 2px;
            background: #16283a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
            <h1 class="logo">{{ site.title }}</h1>
        </a>
        <div class="masthead-rule-wrap"><span class="masthead-rule"></span></div>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} · Tüm hakları saklıdır.</p>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
