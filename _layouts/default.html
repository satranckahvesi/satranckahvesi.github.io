<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 2.5rem 1rem; text-align: center; }
        .brand {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
        }
        .site-logo { width: 96px; height: 96px; flex: none; }
        .logo {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 1.9rem;
            font-weight: 600;
            color: #16283a;
        }
        @media (min-width: 640px) {
            .brand { flex-direction: row; gap: 1.3rem; }
            .site-logo { width: 112px; height: 112px; }
            .logo { font-size: 2.6rem; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ page.title }}">
        <span class="logo">{{ page.title }}</span>
    </div>
    {{ content }}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js"></script>
</body>
</html>
