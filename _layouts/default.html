<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/jpeg" href="{{ '/assets/img/logo.jpg' | relative_url }}">
    {% if page.layout == "post" %}
    <link rel="preconnect" href="https://chesspublica.github.io">
    <link rel="stylesheet" href="https://chesspublica.github.io/dist/ChessPublica.all.min.css">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="no-underline" href="{{ '/#koseler' | relative_url }}">Köşeler</a>
            <a class="no-underline" href="{{ '/#yazarlar' | relative_url }}">Yazarlar</a>
        </nav>
        <div class="masthead">
            <a class="brand no-underline" href="{{ '/' | relative_url }}">
                <img class="site-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="{{ site.title }}">
                <h1 class="masthead-title">{{ site.title }}</h1>
            </a>
            <p class="masthead-tagline">Bir fincan kahve eşliğinde satranç üzerine köşeler ve sohbetler.</p>
        </div>
        <div class="masthead-rule"></div>
    </header>
    {{ content }}
    <footer class="site-footer">
        <p class="footer-credit">{{ site.title }} tarafından hazırlanır · &copy; {{ site.time | date: '%Y' }}</p>
        <a class="no-underline footer-top" href="{{ '/' | relative_url }}">Ana sayfa</a>
    </footer>
    <script src="{{ '/assets/js/curly-quotes.js' | relative_url }}" defer></script>
    {% if page.layout == "post" %}
    <script src="https://chesspublica.github.io/dist/ChessPublica.all.min.js" defer></script>
    {% endif %}
</body>
</html>
