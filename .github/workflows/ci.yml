name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Content, build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec ruby scripts/check_content_links.rb
      - run: bundle exec jekyll build --strict_front_matter
      - run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https

  assets:
    name: JavaScript and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Bundles in assets/ are up to date
        run: npm run check:bundle
